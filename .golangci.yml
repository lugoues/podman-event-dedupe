version: "2"

linters:
  enable:
    - errorlint
    - misspell
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test HTTP handlers write to recorders where errors don't matter.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
